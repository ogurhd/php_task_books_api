services:
  frontend:
    build: frontend
    volumes:
      - ./:/app
  
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=user007_root
      - MYSQL_DATABASE=books
      - MYSQL_USER=user
      - MYSQL_PASSWORD=user007
    ports:
      - "3306:3306"